<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="380" height="60" fill="none">
  <defs>
    <linearGradient id="logoSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="accentMark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Stylized Geometric Mark (Architecture / Portal / Growth) -->
  <g transform="translate(4, 8)">
    <!-- Outer Diamond / Monolith -->
    <rect x="2" y="2" width="36" height="36" rx="6" stroke="url(#logoSilver)" stroke-width="2.5" fill="#0f172a" fill-opacity="0.6"/>
    <!-- Inner Portal / Lens -->
    <circle cx="20" cy="20" r="9" stroke="url(#logoSilver)" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#ffffff"/>
    <path d="M 20 4 L 20 11 M 20 29 L 20 36 M 4 20 L 11 20 M 29 20 L 36 20" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Typography: DLORENZ SOLUTIONS -->
  <g fill="url(#logoSilver)">
    <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5">DLORENZ</text>
    <text x="210" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="300" letter-spacing="3.5" fill="#94a3b8">SOLUTIONS</text>
  </g>

  <!-- Sub-tagline: BUILDING DREAMS, SELLING SUCCESS -->
  <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2.8" fill="#64748b">BUILDING DREAMS, SELLING SUCCESS</text>
</svg>
