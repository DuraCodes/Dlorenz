    <script>
      (function() {
        var isExtensionError = function(msg, url) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          var urlStr = String(url || '').toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('originalprompt') !== -1 ||
            urlStr.indexOf('extension') !== -1 ||
            urlStr.indexOf('chrome-extension') !== -1 ||
            urlStr.indexOf('moz-extension') !== -1
          );
        };
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isExtensionError(msg, url) || (error && isExtensionError(error.message, ''))) {
            return true; // suppresses the error
          }
          return false;
        };
        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename) || (event.error && isExtensionError(event.error.message, ''))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (isExtensionError(reason, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
