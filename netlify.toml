[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route ImageKit API calls to Netlify Serverless Function
[[redirects]]
  from = "/api/imagekit/*"
  to = "/.netlify/functions/imagekit/:splat"
  status = 200

# Route all other URLs to SPA index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
